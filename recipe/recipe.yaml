schema_version: 1

context:
  version: "4.1.0"

package:
  name: stepup
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/stepup/stepup-${{ version }}.tar.gz
  sha256: 317bb40c09f9e3ef0a4267a3d264d6086c064bce0f00c522856c0ea524e6b434

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - stepup = stepup.core.__main__:main
      - sb = stepup.core.__main__:sb_main
      - sc-render-jinja = stepup.core.render_jinja:main

# Notes on the dependencies:
# The file watcher of StepUp uses a platform-specific backend,
# so there is one noarch build per OS, distinguished by a virtual package:
# - Linux: asyncinotify (watchfiles is an optional alternative,
#   selected with STEPUP_WATCHER=watchfiles).
# - macOS and Windows: watchfiles.
# These dependencies are not made optional because they add major value.
requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77.0
    - setuptools-scm >=8.1
    - pip
  run:
    - python >=${{ python_min }}
    - if: linux
      then:
        - __linux
        - asyncinotify >=4.0.9
    - if: osx
      then:
        - __osx
        - watchfiles >=1.3.0
    - if: win
      then:
        - __win
        - watchfiles >=1.3.0
    - attrs >=23.1.0
    - cattrs >=23.2.3
    - jinja2 >=3.1.6
    - parse >=1.19.1
    - path >=16.14.0
    - pyyaml >=6.0
    - rich >=13.0.0

tests:
  - python:
      imports:
        - stepup.core
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - stepup --help
      - sb --help
      - sc-render-jinja --help

about:
  summary: A dynamic Python build tool for reproducible workflows
  description: |
    StepUp is a dynamic build tool and a modern alternative to Make.
    Its defining feature is that workflow generation and execution are unified:
    a plan.py script defines the initial build steps.
    While the workflow is being executed, any step can add more steps and
    dependencies, based on the outputs built so far.
    This makes StepUp ideal for builds where the full set of dependencies
    cannot be determined in advance.

    StepUp Core provides the basic framework for StepUp,
    without any domain-specific features.
  license: LGPL-3.0-or-later
  license_file:
    - LICENSE
    - LICENSES/LicenseRef-StepUp-Logo-v1.txt
  homepage: https://reproducible-reporting.github.io/stepup-core/
  repository: https://github.com/reproducible-reporting/stepup-core/
  documentation: https://reproducible-reporting.github.io/stepup-core/

extra:
  recipe-maintainers:
    - tovrstra
